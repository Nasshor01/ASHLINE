# TaCZ (Timeless and Classics Zero) — ASHLINE bible
# Path after install: often config/tacz-common.toml or config/tacz/*.toml — merge.

[gun]
	# Default easy gun craft OFF — KubeJS removes/replaces recipes
	defaultGunCraftEnabled = false
	enableGunDurability = true
	# Headshot multiplier 2.0–2.5
	headShotMultiplier = 2.25

[ammo]
	# Ammo economy from Create + KubeJS (see docs/03)

[sound]
